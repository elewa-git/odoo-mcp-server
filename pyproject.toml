[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "odoo-mcp-server"
version = "2.0.0"
description = "Odoo MCP Server — Claude MCP tools for Odoo CRM, projects, and domain tools"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Elewa", email = "jente@elewa.ke" }
]
repository = "https://github.com/elewa-git/odoo-mcp-server"
keywords = ["odoo", "mcp", "ai", "claude", "crm", "project-management"]

dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27.0",
    "pydantic>=2.12.0",
    "certifi>=2024.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[project.scripts]
odoo-mcp-server = "src.mcp.odoo.server:main"
odoo-mcp-onboard = "src.core.local_onboarding:main"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "src/core/tests", "src/mcp/odoo/tests"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build]
exclude = [
    "**/__pycache__/**",
    "**/tests/**",
    "**/*.pyc",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/**",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
